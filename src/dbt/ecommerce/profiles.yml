ecommerce:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('SUPABASE_DATABASE_HOST') }}"
      port: "{{ env_var('SUPABASE_DATABASE_PORT') | int }}"
      user: "{{ env_var('SUPABASE_DATABASE_USER') }}"
      password: "{{ env_var('SUPABASE_DATABASE_PASSWORD') }}"
      dbname: "{{ env_var('SUPABASE_DATABASE_DATABASE') }}"
      schema: "public"
      threads: 4